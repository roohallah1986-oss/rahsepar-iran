<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ره‌سپار ایران</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <style>
    :root{
      --bg:#f3f8f7;--card:#fff;--text:#102a2a;--muted:#607070;--brand:#0f766e;--brand2:#14b8a6;
      --danger:#dc2626;--warn:#f59e0b;--ok:#16a34a;--line:#d8e5e2;--shadow:0 12px 30px rgba(15,118,110,.13)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#e9fffb,#f7faf9);color:var(--text)}
    .app{max-width:980px;margin:auto;min-height:100vh;padding:14px}
    .splash{position:fixed;inset:0;background:radial-gradient(circle,#eafffb,#0f766e);display:flex;align-items:center;justify-content:center;z-index:20;flex-direction:column;color:#fff}
    .splash img{width:160px;height:160px;object-fit:contain;border-radius:34px;box-shadow:var(--shadow);background:white}
    .splash h1{font-size:34px;text-shadow:0 3px 10px #064e3b}
    .top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:54px;height:54px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}
    .brand h1{font-size:28px;margin:0;color:var(--brand)}
    .hero{position:relative;border-radius:28px;overflow:hidden;background:#d8f7f1;box-shadow:var(--shadow);min-height:170px;display:flex;align-items:center;justify-content:center}
    .hero img{width:100%;max-height:260px;object-fit:cover}
    .mail{position:absolute;top:12px;right:12px;border:0;border-radius:18px;padding:11px 14px;background:#fff;box-shadow:var(--shadow);font-size:22px;cursor:pointer}
    .badge{background:var(--danger);color:#fff;border-radius:99px;padding:2px 7px;font-size:12px;vertical-align:top}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
    .btn{border:0;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:15px 16px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
    .btn.secondary{background:#fff;color:var(--brand);border:1px solid var(--line)}
    .btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)}
    .btn.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
    .btn:disabled{opacity:.48;cursor:not-allowed}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
    .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .field{display:flex;flex-direction:column;gap:6px;margin:8px 0}
    label{font-size:13px;color:var(--muted);font-weight:700}
    input,select,textarea{border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px;background:#fbfffe;color:var(--text)}
    textarea{min-height:96px;resize:vertical}
    .mini{font-size:12px;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#e6fffb;color:#0f766e;font-weight:700}
    .calcbox{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;border-bottom:1px dashed var(--line);padding:8px 0}
    .money{font-weight:900;color:#064e3b}
    .neg{color:#dc2626}
    .pos{color:#16a34a}
    .hidden{display:none!important}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
    .modal .box{max-width:720px;background:white;border-radius:24px;padding:20px;box-shadow:var(--shadow);line-height:2}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102a2a;color:white;border-radius:999px;padding:12px 18px;z-index:40}
    .listitem{border:1px solid var(--line);border-radius:18px;padding:12px;margin:8px 0;background:#fbfffe}
    .toolbar{position:sticky;bottom:10px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:8px;display:flex;gap:8px;flex-wrap:wrap}
    .printOnly{display:none}
        .itemEntry{display:grid;grid-template-columns:1fr 54px;gap:8px;align-items:center}
    .plusBtn{border:0;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:26px;font-weight:900;height:46px;cursor:pointer;box-shadow:var(--shadow);line-height:1}
    .plusBtn:disabled{opacity:.45;cursor:not-allowed}
    .itemsLine{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:32px}
    .itemChip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fbfffe;border-radius:999px;padding:7px 10px;font-size:13px;color:var(--text)}
    .itemChip b{color:var(--brand)}
    .itemEdit,.itemDelete{border:0;border-radius:999px;padding:4px 7px;cursor:pointer;font-size:12px}
    .itemEdit{background:#e6fffb;color:var(--brand)}
    .itemDelete{background:#fee2e2;color:var(--danger)}
    .sumBox{margin-top:6px}
    .lockedNote{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:16px;padding:10px;margin-top:10px;font-size:13px;font-weight:700}
    .editRequestBox{border:1px dashed var(--warn);background:#fffbeb;border-radius:18px;padding:12px;margin-top:12px}
    @media(max-width:680px){.grid,.row{grid-template-columns:1fr}.brand h1{font-size:22px}.app{padding:10px}}
    @media print{.noPrint,.toolbar,.btn,.top,.hero{display:none!important}.printOnly{display:block}.card{box-shadow:none;border:1px solid #999}body{background:#fff}}
    .btn-mini.danger {
  background: #ef4444;
  color: white;
  border: none;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  float: left; /* برای اینکه بره سمت چپ آیتم لیست */
}
.btn-mini.danger:hover {
  background: #b91c1c;
}
.ownerSearchBox {
  margin: 16px 0;
  padding: 12px;
  background: linear-gradient(135deg, #ffffff, #f7f9fc);
  border: 1px solid #e1e6ef;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(20, 40, 80, 0.06);
}

.ownerSearchTop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.ownerSearchTitle {
  font-size: 13px;
  font-weight: 700;
  color: var(--brand);
}

.ownerSearchCount {
  font-size: 11px;
  color: #777;
  background: #eef3f8;
  padding: 4px 8px;
  border-radius: 999px;
  white-space: nowrap;
}

.ownerSearchInput {
  width: 100%;
  height: 44px;
  border: 1px solid #d7deea;
  border-radius: 12px;
  padding: 0 12px;
  font-size: 13px;
  color: #222;
  background: #fff;
  outline: none;
  box-sizing: border-box;
  transition: 0.2s ease;
}

.ownerSearchInput:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(0, 120, 255, 0.09);
}

.ownerSearchInput::placeholder {
  color: #999;
}

.ownerSearchClear {
  width: 100%;
  margin-top: 10px;
  height: 36px;
  border: none;
  border-radius: 10px;
  background: #fff0f0;
  color: #c62828;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.ownerSearchClear:active {
  transform: scale(0.98);
}

  </style>
</head>
<body>
  <!-- دکمه نصب PWA -->
<div id="install-banner" style="display: none; background: #2ecc71; color: white; padding: 15px; text-align: center; position: fixed; top: 0; width: 100%; z-index: 9999;">
    <span>برنامه ره‌سپار را نصب کنید:</span>
    <button id="install-button" style="background: white; color: #2ecc71; border: none; padding: 5px 15px; margin-right: 10px; border-radius: 5px; font-weight: bold;">نصب</button>
</div>

<div id="splash" class="splash">
  <img src="icon-512.png" onerror="this.style.display='none'">
  <h1>ره‌سپار ایران</h1>
  <p>حساب جاده، دقیق‌تر از کیلومترشمار 😉</p>
</div>

<div id="app" class="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
  
const SKEY = 'rahsepar_v0.3.0_waveA';

const nowFa = () =>
  new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
    dateStyle: 'short',
    timeStyle: 'short'
  }).format(new Date());

const uid = () =>
  Math.random().toString(36).slice(2) + Date.now().toString(36).slice(2);

function num(v) {
  if (v === null || v === undefined) return 0;
  let s = String(v).trim();
  if (!s) return 0;

  s = s
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/٬/g, '')
    .replace(/،/g, '')
    .replace(/[^0-9.\-]/g, '');

  let n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

const toman = n => num(n).toLocaleString('fa-IR') + ' تومان';

function readStorage(key) {
  try {
    return JSON.parse(localStorage.getItem(key) || 'null');
  } catch (e) {
    console.warn('Storage parse error for key:', key, e);
    return null;
  }
}

let oldDb = readStorage('rahsepar_v01');

let db = readStorage(SKEY) || oldDb || {
  users: [],
  current: null,
  vehicles: [],
  ownerContracts: [],
  driverContracts: [],
  trips: [],
  feedback: [],
  qa: [],
  centerMessages: [
    {
      id: 'm1',
      text: 'به ره‌سپار ایران خوش آمدید. پیام‌های مرکز از این قسمت نمایش داده می‌شود.',
      at: nowFa()
    }
  ],
  readMessages: {},
  inbox: [],
  editRequests: []
};

// تکمیل فیلدهای احتمالی نسخه‌های قدیمی
db.users = Array.isArray(db.users) ? db.users : [];
db.current = db.current || null;
db.vehicles = Array.isArray(db.vehicles) ? db.vehicles : [];
db.ownerContracts = Array.isArray(db.ownerContracts) ? db.ownerContracts : [];
db.driverContracts = Array.isArray(db.driverContracts) ? db.driverContracts : [];
db.trips = Array.isArray(db.trips) ? db.trips : [];
db.feedback = Array.isArray(db.feedback) ? db.feedback : [];
db.qa = Array.isArray(db.qa) ? db.qa : [];
db.centerMessages = Array.isArray(db.centerMessages) ? db.centerMessages : [
  {
    id: 'm1',
    text: 'به ره‌سپار ایران خوش آمدید. پیام‌های مرکز از این قسمت نمایش داده می‌شود.',
    at: nowFa()
  }
];
db.readMessages = db.readMessages && typeof db.readMessages === 'object' ? db.readMessages : {};
db.inbox = Array.isArray(db.inbox) ? db.inbox : [];
db.editRequests = Array.isArray(db.editRequests) ? db.editRequests : [];

const save = () => localStorage.setItem(SKEY, JSON.stringify(db));

const current = () => db.users.find(u => u.id === db.current);

const toast = t => {
  let el = document.getElementById('toast');
  if (!el) {
    console.warn('toast element not found');
    return;
  }
  el.textContent = t;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3200);
};

const app = document.getElementById('app');
if (!app) console.warn('#app not found');

setTimeout(() => {
  const splash = document.getElementById('splash');
  if (splash) splash.classList.add('hidden');
}, 2000);

//if ('serviceWorker' in navigator) {  navigator.serviceWorker.register('sw.js').catch(err => {
 //   console.warn('SW register failed:', err);
  //});
 //}

function header(title = 'ره‌سپار ایران') {
  let u = current();

  return `
    <div class="top noPrint">
      <div class="brand">
        <img src="icon-512.png?v=2" onerror="this.style.display='none'">
        <div>
          <h1>${title}</h1>
          <div class="mini">
            ${
              u
                ? ('کاربر: ' + (u.first || '') + ' ' + (u.last || '') + ' | نقش: ' + (u.role === 'owner' ? 'مالک' : 'راننده'))
                : 'نسخه MVP لوکال‌فرست'
            }
          </div>
        </div>
      </div>
    </div>
  `;
}

function nav() {
  return `
    <div class="toolbar noPrint">
      <button class="btn secondary" onclick="home()">🏠 صفحه اول</button>
      <button class="btn secondary" onclick="historyBack()">↩️ برگشت</button>
      <button class="btn secondary" onclick="help()">❔ راهنما</button>
      <button class="btn danger" onclick="logout()">خروج &gt;</button>
    </div>
  `;
}

function historyBack() {
  const u = current();

  if (!u) {
    home();
    return;
  }

  if (u.role === 'owner') {
    ownerDash();
  } else {
    driverDash();
  }
}

function logout() {
  if (confirm('آیا واقعاً قصد خروج دارید؟')) {
    db.current = null;
    save();
    home();
  }
}

function help() {
  toast('برای مخارج، مبلغ یا شرح+مبلغ را بنویس و کلید + را بزن. Enter هم کار می‌کند. بعد از ثبت سرویس، فرم قفل می‌شود و ویرایش فقط با درخواست انجام می‌شود.');
}

function home() {
  let u = current();
  let unread = db.centerMessages.filter(m => !(db.readMessages[u?.id || 'guest'] || []).includes(m.id)).length;

  app.innerHTML =
    header('ره‌سپار ایران') +
    `
    <div class="hero">
      <img src="image.png" onerror="this.outerHTML='<div style=\\'font-size:32px;color:#0f766e;font-weight:900\\'>ره‌سپار ایران</div>'">
      <button class="mail" onclick="messages()">✉️ ${unread ? `<span class='badge'>${unread}</span>` : ''}</button>
    </div>

    <div class="grid">
      <button class="btn" onclick="enterRole('owner')">مالکان خودرو</button>
      <button class="btn" onclick="enterRole('driver')">رانندگان</button>
      <button class="btn secondary" onclick="otherModal()">سایر</button>
      <button class="btn secondary" ${u ? '' : 'disabled'} onclick="feedbackPage()">انتقادات و پیشنهادات</button>
      <button class="btn secondary" ${u ? '' : 'disabled'} onclick="qaPage()">پرسش و پاسخ</button>
      <button class="btn danger" onclick="logout()">خروج &gt;</button>
    </div>
  `;
}
function messages() {
  let u = current();
  let uidv = u?.id || 'guest';

  // 1. اول مطمئن میشیم که ساختار داده‌ها در دیتابیس وجود داره
  if (!Array.isArray(db.centerMessages)) db.centerMessages = [];
  if (!db.readMessages || typeof db.readMessages !== 'object') db.readMessages = {};

  // 2. تمام پیام‌های موجود رو برای این کاربر به عنوان "خوانده شده" علامت می‌زنیم
  db.readMessages[uidv] = db.centerMessages.map(m => m.id);
  save(); // ذخیره در دیتابیس

  // 3. نمایش صفحه پیام‌ها
  app.innerHTML = header('پیام‌های مرکز') +
    `<div class="card">
      ${db.centerMessages.length > 0 
        ? db.centerMessages.map(m => `
            <div class='listitem' style="border-bottom:1px solid #eee; padding:10px 0;">
              <b style="color:#0f766e;">✉️ پیام مدیریت</b>
              <p style="margin:5px 0;">${m.text}</p>
              <span class='mini' style="color:#888; font-size:11px;">${m.at}</span>
            </div>
          `).join('')
        : "<p style='text-align:center; padding:20px;'>پیامی وجود ندارد.</p>"
      }
    </div>` + 
    nav(); // اضافه کردن نویگیشن برای برگشت

  // 4. یک کلک رشتی برای اینکه وقتی کاربر دکمه برگشت رو زد، عدد پاکت همون لحظه غیب شده باشه
  // با این کار به محض باز شدن صفحه، محاسبات unread در پس‌زمینه آپدیت میشه
}

function ensureOwnerDriverProfile(ownerUser) {
  if (!ownerUser || ownerUser.role !== 'owner') return null;

  if (!Array.isArray(db.users)) db.users = [];

  const driverId = 'DRIVER-' + ownerUser.phone;

  let driverUser = db.users.find(x => x.id === driverId);

  const driverData = {
    id: driverId,
    role: 'driver',
    first: ownerUser.first || '',
    last: ownerUser.last || '',
    phone: ownerUser.phone || '',
    pass: ownerUser.pass || '',
    device: ownerUser.device || 'local-device',
    at: ownerUser.at || nowFa(),

    // اتصال راننده به مالک
    ownerId: ownerUser.id,
    isSelfDriver: true
  };

  if (driverUser) {
    Object.assign(driverUser, driverData);
  } else {
    db.users.push(driverData);
  }

  return driverData;
}


function enterRole(role) {
  let u = current();

  if (!u) return auth(role);

  // اگر کاربر راننده عادی است، اجازه ورود به پنل مالک ندارد
  // اما اگر این راننده، نسخه راننده‌ی خود مالک باشد، می‌تواند به مالک خودش برگردد
  if (role === 'owner' && u.role !== 'owner') {
    if (u.ownerId) {
      db.current = u.ownerId;
      save();
      return ownerDash();
    }

    return toast('دسترسی غیرمجاز: راننده اجازه ورود به پنل مالک را ندارد.');
  }

  // مالک اجازه دارد وارد پنل راننده شود
  // چون ممکن است خودش هم راننده ماشین خودش باشد
  if (role === 'driver' && u.role === 'owner') {
    const driverUser = ensureOwnerDriverProfile(u);

    if (!driverUser) {
      return toast('خطا در ساخت پروفایل راننده برای مالک');
    }

    db.current = driverUser.id;
    save();

    return driverDash();
  }

  if (role === 'owner') return ownerDash();
  return driverDash();
}


function auth(role) {
  let price = role === 'owner' ? 450000 : 400000;

  app.innerHTML =
    header(role === 'owner' ? 'ثبت‌نام مالک' : 'ثبت‌نام راننده') +
    `
    <div class='card'>
      <span class='pill'>مبلغ حق عضویت: ${toman(price)}</span>

      <div class='row'>
        <div class='field'><label>نام</label><input id='first'></div>
        <div class='field'><label>نام خانوادگی</label><input id='last'></div>
        <div class='field'><label>شماره همراه</label><input id='phone'></div>
      </div>

      <div class='actions'>
        <button class='btn' onclick="simulatePay('${role}')">
        پرداخت و ارسال کد تایید
        </button>
      </div>

      <div id='otpBox'></div>
    </div>
  ` + nav();
}



async function simulatePay(role) {

  const phoneVal = document.getElementById('phone')?.value.trim() || '';

  if (!phoneVal) {
    return toast('شماره موبایل الزامی است');
  }

  if (!/^09\d{9}$/.test(phoneVal)) {
    return toast('شماره موبایل معتبر نیست (مثال: 09123456789)');
  }

  try {

    toast('در حال ارسال کد تایید...');

    const res = await fetch('http://localhost:5000/api/request-otp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        phone: phoneVal,
        role: role
      })
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      return toast(data.message || 'خطا در ارسال کد تایید');
    }

    document.getElementById('otpBox').innerHTML = `

      <div class='field'>
        <label>کد تایید پیامک شده</label>
        <input id='otp'
        inputmode='numeric'
        autocomplete='one-time-code'
        placeholder='کد تایید'>
      </div>

      <div class='field'>
        <label>رمز عبور دائمی</label>
        <input id='pass' type='password'
        placeholder='رمز دلخواه خود را وارد کنید'>
      </div>

      <button class='btn'
      onclick="finishAuth('${role}')">
      ثبت نهایی
      </button>

    `;

    toast('کد تایید برای شما ارسال شد');

  } catch (err) {

    console.error('request otp error:', err);

    toast('ارتباط با سرور برقرار نشد');

  }

}

async function finishAuth(role) {

  if (!Array.isArray(db.users)) db.users = [];

  const otpVal = document.getElementById('otp')?.value.trim() || '';
  const phoneVal = document.getElementById('phone')?.value.trim() || '';
  const firstVal = document.getElementById('first')?.value.trim() || '';
  const lastVal = document.getElementById('last')?.value.trim() || '';
  const passVal = document.getElementById('pass')?.value || '';



  if (!phoneVal) {
    return toast('شماره موبایل الزامی است');
  }

  if (!/^09\d{9}$/.test(phoneVal)) {
    return toast('شماره موبایل معتبر نیست');
  }

  if (!otpVal) {
    return toast('کد تایید را وارد کنید');
  }

  if (!passVal) {
    return toast('رمز عبور را وارد کنید');
  }



  try {

    toast('در حال بررسی کد تایید...');

    const res = await fetch('http://localhost:5000/api/verify-otp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        phone: phoneVal,
        code: otpVal,
        role: role
      })
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      return toast(data.message || 'کد تایید نادرست است');
    }



    const uniqueKey = role.toUpperCase() + '-' + phoneVal;

    let oldUser = db.users.find(x => x.id === uniqueKey);



    let u = {
      id: uniqueKey,
      role: role,
      first: firstVal,
      last: lastVal,
      phone: phoneVal,
      pass: passVal,
      device: 'local-device',
      at: nowFa()
    };



    if (oldUser) {

      Object.assign(oldUser, u);
      u = oldUser;

    } else {

      db.users.push(u);

    }



    // اگر مالک باشد یک پروفایل راننده هم برای خودش ساخته می‌شود
    if (role === 'owner') {
      ensureOwnerDriverProfile(u);
    }



    db.current = uniqueKey;

    save();



    toast('ثبت‌نام با موفقیت انجام شد');



    role === 'owner'
      ? ownerDash()
      : driverDash();



  } catch (err) {

    console.error('verify otp error:', err);

    toast('خطا در تایید کد');

  }

}

let tempItems={fees:[],driverCost:[],carCost:[]};

function itemAmountFromText(text){
  return num(text);
}

function itemDisplayText(item){
  let raw=(item.text||'').trim();
  if(!raw) return toman(item.amount);

  let onlyNumber=raw
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/٬/g,'')
    .replace(/،/g,'')
    .replace(/[^0-9.\-]/g,'')
    .trim();

  if(onlyNumber && Number(onlyNumber).toString()===String(num(raw))){
    return toman(item.amount);
  }

  return raw;
}

function addItem(id){
  let el=document.getElementById(id+'Text');
  let editEl=document.getElementById(id+'EditIndex');
  if(!el) return;

  let text=el.value.trim();
  let amount=itemAmountFromText(text);

  if(!text || amount===0){
    toast('اول شرح یا مبلغ معتبر وارد کن، بعد + را بزن.');
    return;
  }

  let editIndex=editEl && editEl.value!=='' ? Number(editEl.value) : -1;
  let item={text,amount};

  if(editIndex>=0 && tempItems[id] && tempItems[id][editIndex]){
    tempItems[id][editIndex]=item;
    editEl.value='';
    toast('آیتم ویرایش شد.');
  }else{
    tempItems[id].push(item);
  }

  el.value='';
  renderItems(id);
  calculateTripIfVisible();
  el.focus();
}

function editItem(id,index){
  if(!tempItems[id] || !tempItems[id][index]) return;

  let el=document.getElementById(id+'Text');
  let editEl=document.getElementById(id+'EditIndex');

  el.value=tempItems[id][index].text;
  editEl.value=String(index);
  el.focus();

  toast('آیتم برای ویرایش داخل کادر برگشت. اصلاح کن و + را بزن.');
}

function deleteItem(target, indexOrId, callback, label = 'مورد نظر') {
  // تایید مرحله اول
  if (!confirm(`آیا از حذف این ${label} اطمینان دارید؟`)) return;
  // تایید مرحله دوم (حساسیت بیشتر)
  if (!confirm(`هشدار: حذف ${label} غیرقابل بازگشت است. ادامه می‌دهی؟`)) return;

  // حالت ۱: حذف از tempItems (اگر index عدد باشد)
  if (typeof indexOrId === 'number') {
    if (tempItems[target] && tempItems[target][indexOrId] !== undefined) {
      tempItems[target].splice(indexOrId, 1);
      
      let editEl = document.getElementById(target + 'EditIndex');
      if (editEl) editEl.value = '';

      renderItems(target);
      calculateTripIfVisible();
      toast(`${label} حذف شد.`);
    }
  } 
  // حالت ۲: حذف از دیتابیس اصلی db (اگر id رشته/String باشد)
  else if (typeof indexOrId === 'string' && db[target]) {
    db[target] = db[target].filter(item => item.id !== indexOrId);
    save(); // ذخیره در localStorage
    
    toast(`${label} با موفقیت حذف شد`);
    
    // اگر نیاز به رندر مجدد صفحه بود
    if (typeof callback === 'function') callback();
  }
}

function renderItems(id){
  let box=document.getElementById(id+'Items');
  let sumBox=document.getElementById(id+'Sum');
  if(!box || !sumBox) return;

  let total=tempItems[id].reduce((a,b)=>a+num(b.amount),0);

  box.innerHTML=tempItems[id].map((x,i)=>`
    <span class='itemChip'>
      <b>${itemDisplayText(x)} +</b>
      <button type='button' class='itemEdit' onclick="editItem('${id}',${i})">ویرایش</button>
      <button type='button' class='itemDelete' onclick="deleteItem('${id}',${i})">×</button>
    </span>
  `).join('');

  sumBox.textContent=toman(total);
}

function calcValues(){
  let c=activeContract();
  let farev=num(fare.value);
  let fees=tempItems.fees.reduce((a,b)=>a+b.amount,0);
  let dc=tempItems.driverCost.reduce((a,b)=>a+b.amount,0);
  let cc=tempItems.carCost.reduce((a,b)=>a+b.amount,0);
  let net=farev-fees;
  let baseFor=c.percentBase==='کل کرایه'?farev:net;

  let salary=0;
  if(c.type==='درصدی') salary=net*c.percent/100;
  else if(c.type==='ثابت') salary=c.base;
  else if(c.type==='پایه ثابت و درصد') salary=c.base+(baseFor*c.percent/100);
  else salary=c.base;

  let rem=salary-dc-cc;
  let final=rem+num(prevBalance.value);

  let paidv=num(paid.value);
  let diff=paidv-farev;

  let deductions=0;
  let extraFare=0;
  if(diff<0) deductions=Math.abs(diff);
  if(diff>0) extraFare=diff;

  return {
    c,farev,fees,net,dc,cc,salary,rem,final,paidv,deductions,extraFare,prev:num(prevBalance.value)
  };
}

function copyToClipboard(text) {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
}
function escapeAttr(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function filterOwnerTrips(keyword) {
  const allTrips = Array.isArray(db.trips) ? db.trips : [];
  const q = String(keyword || '').trim().toLowerCase();

  if (!q) return allTrips;

  return allTrips.filter(t => {
    return [
      t.bill,
      t.driverName,
      t.user,
      t.from,
      t.to,
      t.notes,
      t.paidAt
    ].some(item => String(item || '').toLowerCase().includes(q));
  });
}

           ${keyword ? `${trips.length} نتیجه از ${allTrips.length}` : `${allTrips.length} صورت‌حساب کل`}
        </div>
        ${keyword ? `<div style="color:blue; font-size:12px; cursor:pointer; margin-top:5px;" onclick="ownerReports('')">❌ حذف فیلتر</div>` : ''}

}

// این تابع کمکی رو حتماً زیر تابع بالا اضافه کن
function renderOwnerTripsList(trips, keyword) {
  if (!trips.length) {
    return `<p style="text-align:center; padding:20px;">${keyword ? 'موردی با این جستجو پیدا نشد.' : 'هنوز صورتحسابی ارسال نشده است.'}</p>`;
  }

  return trips.map((t, index) => {
    const tripId = t.id || ('trip_' + index);
    const finalAmount = num(t.final);
    const deductions = num(t.deductions);
    const extraFare = num(t.extraFare);
    const paid = num(t.paid);

    return `
      <div class='listitem' style="position:relative; padding-bottom: 50px; margin-bottom:12px; border-right:4px solid #ddd;">
        <div style="margin-bottom:8px">
          <b>بارنامه:</b> ${t.bill || '-'} | <b>مسیر:</b> ${t.from || '-'} به ${t.to || '-'}
        </div>
        <div style="margin-bottom:6px;"><b>راننده:</b> ${t.driverName || t.user || '-'}</div>
        <div>مانده نهایی: <b class='${finalAmount >= 0 ? 'pos' : 'neg'}'>${toman(finalAmount)}</b></div>
        <div class='mini' style="margin-top:6px;">
          کسورات: <span class='neg'>${toman(deductions)}</span> | اضافه‌کرایه: <span class='pos'>${toman(extraFare)}</span>
        </div>
        <div class='mini' style="margin-top:4px;">
          واریزی: <span>${toman(paid)}</span> | تاریخ: <span>${t.paidAt || 'ثبت نشده'}</span>
        </div>

        <!-- بخش جزئیات -->
        <div id="details-${tripId}" class="hidden" style="margin-top:15px; padding:8px; border-top:1px dashed #ccc; font-size:12px; background:#f9f9f9; border-radius:8px;">
          <div style="color:var(--brand); font-weight:bold; margin-bottom:8px;">📋 ریز مخارج:</div>
          <div style="margin-bottom:6px;"><b>فنی:</b> ${typeof renderDetailItems === 'function' ? renderDetailItems(t.items?.fees) : '-'}</div>
          <div style="margin-bottom:6px;"><b>راننده:</b> ${typeof renderDetailItems === 'function' ? renderDetailItems(t.items?.driverCost) : '-'}</div>
          <div style="margin-top:8px; border-top:1px solid #eee; padding-top:8px;"><b>توضیحات:</b> ${t.notes || '-'}</div>
        </div>

        <!-- دکمه جزئیات -->
        <button class='btn secondary' style="position:absolute; left:10px; bottom:10px; padding:5px 12px; font-size:12px; height:32px; min-width:auto;" onclick="toggleDetails('${tripId}')">
          مشاهده جزئیات
        </button>

        <!-- دکمه‌های ویرایش اگر درخواستی باشد -->
        ${t.editRequested ? `
          <div class='editRequestBox' style="margin-top:12px; background:#fff4e5; padding:10px; border-radius:5px;">
            <b>⚠️ درخواست ویرایش:</b> ${t.editReason || '-'}
            <div class='actions' style="margin-top:10px">
              <button class='btn warn' onclick="approveTripEdit('${tripId}')">تأیید</button>
              <button class='btn danger' onclick="rejectTripEdit('${tripId}')">رد</button>
            </div>
          </div>
        ` : ''}
      </div>`;
  }).join('');
}

function approveTripEdit(tripId){
  let trip=db.trips.find(t=>t.id===tripId);
  if(!trip) return toast('سرویس پیدا نشد.');

  trip.editStatus='approved';
  trip.editRequested=false;
  trip.editApprovedAt=nowFa();

  if(db.editRequests){
    db.editRequests
      .filter(r=>r.tripId===tripId && r.status==='pending')
      .forEach(r=>r.status='approved');
  }

  save();
  toast('درخواست ویرایش تأیید شد.');
  ownerReports();
}

function rejectTripEdit(tripId){
  let trip=db.trips.find(t=>t.id===tripId);
  if(!trip) return toast('سرویس پیدا نشد.');

  trip.editStatus='rejected';
  trip.editRequested=false;
  trip.editRejectedAt=nowFa();

  if(db.editRequests){
    db.editRequests
      .filter(r=>r.tripId===tripId && r.status==='pending')
      .forEach(r=>r.status='rejected');
  }

  save();
  toast('درخواست ویرایش رد شد.');
  ownerReports();
}

const normalizeText = (t) => t ? String(t).replace(/ی/g, 'ی').replace(/ک/g, 'ک').trim() : '';
const sum = (arr, key) => arr.reduce((s, a) => s + (Number(a[key]) || 0), 0);

function filterTrips(trips, query) {
    if (!query) return trips;
    const q = normalizeText(query);
    return trips.filter(t => 
        normalizeText(t.origin).includes(q) || 
        normalizeText(t.dest).includes(q) || 
        normalizeText(t.driver).includes(q)
    );
}

function renderArchiveList(query = '') {
    const listDiv = document.getElementById('archiveList');

                        🔍 بررسی و تایید

                </div>
            ` : ''}
        </div>`;
    }).join('');
}

let deferredPrompt;
const installBanner = document.getElementById('install-banner');
const installButton = document.getElementById('install-button');

window.addEventListener('beforeinstallprompt', (e) => {
    // جلوگیری از نمایش خودکار مرورگر
    e.preventDefault();
    // ذخیره رویداد برای استفاده بعدی
    deferredPrompt = e;
    // نمایش بنر نصب سفارشی ما
    installBanner.style.display = 'block';
});

installButton.addEventListener('click', async () => {
    if (deferredPrompt) {
        // نمایش منوی نصب اصلی مرورگر
        deferredPrompt.prompt();
        // منتظر ماندن برای پاسخ کاربر
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to install: ${outcome}`);
        // ریست کردن متغیر
        deferredPrompt = null;
        // مخفی کردن بنر ما
        installBanner.style.display = 'none';
    }
});
// مخفی کردن بنر اگر کاربر قبلاً نصب کرده یا خارج شده
window.addEventListener('appinstalled', () => {
    installBanner.style.display = 'none';
    console.log('PWA installed successfully!');
});
